  <!-- ESTILOS DEL BOTÓN CANAL DE OFERTAS + SCROLL DESTACADOS -->
  <style>
    .channel-float {
      position: fixed;
      bottom: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      height: 50px;
      background: linear-gradient(135deg, #ff0055, #ff3377);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 25px;
      z-index: 999;
      box-shadow: 0 0 24px rgba(255, 0, 85, 0.6);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: floatChannel 3s ease-in-out infinite;
    }

    @keyframes floatChannel {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .channel-float:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 34px rgba(255, 0, 85, 0.9);
    }

    /* SCROLL DE DESTACADOS */
    .featured-section {
      display: block;
      width: 100%;
      max-width: 100%;
      margin-bottom: 30px;
      padding: 20px;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, #0a0d1a 0%, #131829 55%, #0a0d1a 100%);
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.12);
      overflow: hidden;
    }

    .featured-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .featured-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
      margin: 0;
    }

    .featured-nav-btns {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .featured-arrow {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-hi);
      background: var(--bg-2);
      color: var(--cyan);
      font-size: 1.35rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .featured-arrow:hover {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.55);
    }

    .featured-track {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 4px 2px 10px;
      -webkit-overflow-scrolling: touch;
    }

    .featured-track::-webkit-scrollbar {
      height: 6px;
    }
    .featured-track::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 999px;
    }
    .featured-track::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.35);
      border-radius: 999px;
    }
    .featured-track::-webkit-scrollbar-thumb:hover {
      background: var(--cyan);
    }

    .featured-card {
      flex: 0 0 185px;
      width: 185px;
      min-width: 185px;
      max-width: 185px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .featured-card:hover {
      transform: translateY(-4px);
      border-color: var(--cyan);
      box-shadow: 0 10px 26px rgba(0, 240, 255, 0.22);
    }

    .featured-card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #1a1f3a, #0c0e17);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .featured-card-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .featured-card-placeholder {
      font-size: 2.6rem;
      opacity: 0.4;
    }

    .featured-card-price {
      padding: 10px 8px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: var(--green);
      background: var(--bg-2);
      border-top: 1px solid var(--border);
      text-shadow: 0 0 10px rgba(0, 255, 157, 0.25);
      white-space: nowrap;
    }

    /* BOTONES ADMIN EN CADA CARD */
    .card-admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding-right: 85px;
      position: relative;
      z-index: 4;
    }

    .card-admin-actions .card-admin-btn {
      position: static !important;
      padding: 5px 9px;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-admin-actions .card-admin-btn:hover {
      transform: scale(1.05);
    }

    .card-admin-actions .card-admin-delete {
      background: linear-gradient(135deg, #b71c1c, #d63031);
      color: #fff;
      box-shadow: 0 2px 8px rgba(214, 48, 49, 0.4);
    }

    .card-admin-actions .card-admin-feature {
      background: var(--bg-2);
      color: var(--text-dim);
      border: 1px solid var(--border-hi);
    }

    .card-admin-actions .card-admin-feature:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .card-admin-actions .card-admin-feature.is-featured {
      background: linear-gradient(135deg, var(--cyan), #00b4d8);
      color: #000;
      border: 1px solid var(--cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
    }

    .card-enfocada {
      border-color: var(--cyan) !important;
      box-shadow:
        0 0 30px rgba(0, 240, 255, 0.55),
        0 0 60px rgba(0, 240, 255, 0.25),
        0 18px 50px rgba(0, 0, 0, 0.7) !important;
      transform: translateY(-4px);
    }

    @media (max-width: 640px) {
      .channel-float {
        bottom: 16px;
        left: 16px;
        height: 44px;
        padding: 0 16px;
        font-size: 0.8rem;
      }
      .featured-section {
        padding: 14px 12px;
        margin-bottom: 20px;
      }
      .featured-title {
        font-size: 0.95rem;
      }
      .featured-card {
        flex: 0 0 145px;
        width: 145px;
        min-width: 145px;
        max-width: 145px;
      }
      .featured-card-price {
        padding: 8px 6px;
        font-size: 0.88rem;
      }
      .card-admin-actions {
        padding-right: 60px;
      }
    }
  </style>
